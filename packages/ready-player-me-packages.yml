  example projects) and therefore have no package-registry metadata endpoint. Currency is
  recorded per entry from the registry / GitHub Releases API, read 2026-08-26.
note: >-
  Every package here wraps an API that is offline. Netflix acquired Ready Player Me in
  December 2025 and the public platform — Avatar Creator, PlayerZero and the developer
  APIs at api.readyplayer.me — was shut down on 2026-01-31. See
  lifecycle/ready-player-me-lifecycle.yml. The newest first-party release in the whole set
  predates the shutdown by six months, and nothing has shipped since; the GitHub
  organization remains public and rpm-unity-sdk-core has been archived.
