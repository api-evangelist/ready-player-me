  description: 'Create, retrieve, update, and delete Ready Player Me cross-platform avatars. Includes template-based
    creation, asset equipping, draft management, color palette discovery, and binary glTF (.glb) plus 2D PNG renders
    used in Unity, Unreal, web, iOS, and Android. Supports A/T-pose, mesh LODs, texture atlases, ARKit / Oculus
    morph targets, Draco and Meshopt compression. RETIRED: the public platform was shut down on 2026-01-31 following
    Netflix''s December 2025 acquisition, and api.readyplayer.me no longer resolves — this entry is a historical
    record of the contract, not a callable API.'
