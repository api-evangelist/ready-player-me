  description: 'Discover and retrieve avatar wearable assets — hair, outfits, headwear, glasses, facewear, footwear,
    beards, costumes, and custom assets — scoped to an application and optionally filtered to those viewable or
    usable by a specific user. Powers the wardrobe surface of the Ready Player Me Avatar Creator. RETIRED: the public
    platform was shut down on 2026-01-31 following Netflix''s December 2025 acquisition, and api.readyplayer.me
    no longer resolves — this entry is a historical record of the contract, not a callable API.'
