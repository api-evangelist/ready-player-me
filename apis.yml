description: 'Ready Player Me was a cross-game avatar platform: a hosted Avatar Creator plus REST APIs that produced
  interoperable 3D character avatars as binary glTF (.glb) and 2D PNG renders for Unity, Unreal, web, iOS and Android.
  The Avatars, Assets and Auth APIs covered draft/save avatar creation, template-based creation, wearable-asset
  equipping and discovery, colour palettes, render precompilation and anonymous/email-code user authentication,
  all scoped to a studio application via an X-APP-ID header. Netflix acquired the company in December 2025 and the
  public platform - Avatar Creator, PlayerZero and the developer APIs at api.readyplayer.me - was shut down on 31
  January 2026. As of 26 August 2026 readyplayer.me publishes MX and TXT records but no A record, and api.readyplayer.me,
  docs.readyplayer.me and studio.readyplayer.me are NXDOMAIN, so every first-party developer surface is gone. Avatars
  already exported as .glb files still load in any glTF 2.0 engine; the readyplayerme GitHub organization and two
  npm packages remain public.'
