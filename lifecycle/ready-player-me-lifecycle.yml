description: 'The Ready Player Me public developer platform is RETIRED. Netflix acquired Ready Player Me in December
  2025 and the public surface — the hosted Avatar Creator, PlayerZero, and the developer APIs at api.readyplayer.me
  — was shut down on 2026-01-31. As of 2026-08-26 the retirement is complete at the DNS layer: readyplayer.me publishes
  MX and TXT records but no A record, and api.readyplayer.me, docs.readyplayer.me and studio.readyplayer.me are
  all NXDOMAIN. Avatars already exported as .glb/glTF files continue to work offline in game engines; anything that
  resolved an avatar or asset at runtime no longer does.'
