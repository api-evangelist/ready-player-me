    kind: hosted-iframe
    functional: false
    description: >-
      The Avatar Creator was delivered as an iframe hosted on a per-studio subdomain, embedded in the
      integrator's page or WebView. It handled the whole avatar-authoring flow and posted the resulting
      avatar id/URL back to the host application.
    components:
      - name: Avatar Creator iframe
        distribution: hosted
        url: null
        note: >-
          Host removed from DNS; the embed URL cannot be recorded from a live source and is not
