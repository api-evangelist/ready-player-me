provider: Ready Player Me
providerId: ready-player-me
description: >-
  Client-side and embeddable surfaces Ready Player Me published for integrators. The product was
  delivered as much through embedded UI as through REST: a hosted Avatar Creator iframe, framework
  wrappers around it, and a web renderer for the resulting avatars. All of these still install from
  npm and GitHub, but the two that depend on hosted Ready Player Me endpoints no longer function —
  the platform was shut down 2026-01-31 and every readyplayer.me host is now NXDOMAIN.
service_status: retired
