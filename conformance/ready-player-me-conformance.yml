description: >-
  Cross-cutting and domain-standard conformance for the Ready Player Me REST surface, read from
  the contract itself. The provider's compliance and trust pages could not be searched — every
  readyplayer.me host was removed from DNS after the 2026-01-31 platform shutdown — so no
